[project]
name = "spammaild"
version = "2.0.0"
description = "E-posta risk analizi: içerik modeli, kimlik doğrulama, URL ve ek analizi"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "jinja2>=3.1",
    "httpx>=0.28",
    "tldextract>=5.1",
    "authres>=1.2",
    "scikit-learn>=1.5",
    "skops>=0.10",
    "numpy>=2.0",
    "scipy>=1.13",
]

[project.optional-dependencies]
transformer = [
    "onnxruntime>=1.19",
    "tokenizers>=0.20",
]
dkim = [
    "dkimpy>=1.1",
    "dnspython>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["spammaild*"]

[tool.setuptools.package-data]
spammaild = ["web/templates/*.html", "web/static/*", "web/static/samples/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "S", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"training/**" = ["S301", "S311", "S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: gerçek ClamAV servisi ister (CI'da elle tetiklenir)",
]
